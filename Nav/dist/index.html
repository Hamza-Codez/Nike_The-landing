<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <title>Document</title>
</head>

<body class="font-[Poppins] bg-gradient-to-t from-gray-200 to-slate-500 h-screen">
   <header class="bg-white">
    <nav class="flex justify-between items-center w-[92%] mx-auto">
      <div>
        <img class=" py-[1vw]" src="images/brand_logo.png" alt="---">
      </div>
      <div class="nav-Links md:static absolute md:bg-white bg-red-700 md:text-black text-gray-100 md:min-h-fit min-h-[60vh] left-0 top-[-90%] md:w-auto w-full flex items-center px-5">
          <ul class="flex md:flex-row flex-col md:items-center md:gap-[4vw] gap-8">
            <li>
              <a class="md:hover:text-gray-500 hover:text-white" href="#">
                About
              </a>
            </li>
            <li>
              <a class="md:hover:text-gray-500 hover:text-white" href="#">
                Location
              </a>
            </li>
            <li>
              <a class="md:hover:text-gray-500 hover:text-white" href="#">
                Contact
              </a>
            </li>
            <li>
              <a class="md:hover:text-gray-500 hover:text-white" href="#">
                Menu
              </a>
            </li>
          </ul>
      </div>
      <div class="flex items-center gap-6">
        <button class="bg-[#D01C28] text-white md:px-5 md:py-2 px-4 py-2 md:rounded-sm rounded-3xl hover:bg-red-600">Login</button>
        <ion-icon onclick="ontoggleMenu(this)" name="menu" class="text-3xl cursor-pointer md:hidden"></ion-icon>
      </div>
    </nav>
   </header>
</body>
   <script>
    const navLinks = document.querySelector('.nav-Links');
      function ontoggleMenu(element) {
      element.name = element.name === 'menu' ? 'close' : 'menu';
      navLinks.classList.toggle('top-[-90%]');
      navLinks.classList.toggle('top-[9%]');
    }
  </script>
</html>
